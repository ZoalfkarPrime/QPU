services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: qpu-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Qpu!Sql2022Pass"
    ports:
      - "14333:1433"
    volumes:
      - qpu-sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"Qpu!Sql2022Pass\" -Q \"SELECT 1\" -C || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"Qpu!Sql2022Pass\" -Q \"SELECT 1\""
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  qpu:
    build:
      context: .
      dockerfile: QPU/Dockerfile
    container_name: qpu-app
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_HTTP_PORTS: "8080"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      Database__ApplyMigrationsOnStartup: "true"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=QPU;User Id=sa;Password=Qpu!Sql2022Pass;TrustServerCertificate=True;Encrypt=False;MultipleActiveResultSets=True"
      FileManager__UploadPath: "/app/uploads"
      FileManager__UploadRelativePath: "/uploads/"
      FileManager__APIBaseURL: "https://api.qpu.buzz"
      FileManager__MaxFileSize: "52428800"
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - qpu-uploads:/app/uploads

  nginx:
    image: nginx:alpine
    container_name: qpu-nginx
    ports:
      - "8081:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - qpu-uploads:/app/uploads:ro
    depends_on:
      - qpu

volumes:
  qpu-sqlserver-data:
  qpu-uploads:
